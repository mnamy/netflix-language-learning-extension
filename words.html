<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Language Learner</title>
    <link rel="stylesheet" href="words.css" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <h1>Language Learner</h1>
        <p class="sub">
          Sign in to save words from Netflix. Study them in the word bank.
        </p>
      </header>

      <section class="account" id="account">
        <p id="account-status">Checking account…</p>
        <form id="sign-in-form" class="account-form">
          <input id="email" type="email" placeholder="Email" required autocomplete="email" />
          <input
            id="password"
            type="password"
            placeholder="Password"
            required
            autocomplete="current-password"
          />
          <button type="submit">Sign in</button>
        </form>
        <button type="button" id="google-sign-in" class="google">
          Sign in with Google
        </button>
        <p id="account-error" class="account-error" hidden></p>
        <div id="signed-in-actions" hidden>
          <button type="button" id="open-bank" class="open-bank">Open Word Bank</button>
          <button type="button" id="sign-out" class="sign-out">Sign out</button>
        </div>
      </section>
    </main>
    <script src="src/supabase/public-config.js"></script>
    <script src="src/supabase/client.js"></script>
    <script src="words.js"></script>
  </body>
</html>
